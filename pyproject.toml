[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quality-lab"
version = "0.1.0"
description = "Automated evaluation framework for a mock AI chatbot with configurable guardrails."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies: intentionally none. The framework uses the standard library only.
# The real-LLM client also uses only the standard library; DeepEval is an optional extra.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
# Phase 5: DeepEval for LLM evaluation. Pinned exactly; it pulls in ~60 transitive packages.
# `ollama` is required by DeepEval's OllamaModel (the default local judge) but is not a
# dependency of deepeval itself.
llm = [
    "deepeval==4.3.2",
    "ollama==0.6.3",
]
# Phase 6: Ragas, installed ONLY into the separate .venv-ragas (requirements-ragas.txt).
# It cannot share an environment with the `llm` extra: every `instructor` release (a Ragas
# dependency) pins jiter<0.15, while openai 3.x (used by DeepEval here) needs jiter>=0.16.
ragas = [
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai, which langchain-community
    # 0.4.x removed (ModuleNotFoundError at `import ragas`). 0.3.31 verified with pip check.
    "langchain-community<0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# -ra: summarise skips/xfails/failures; --strict-markers: typo'd markers are errors, not silent no-ops.
# -p no:deepeval / no:asyncio: DeepEval installs pytest plugins that auto-load into every run; this
# suite uses neither (DeepEval evaluations run via `python -m ai_quality_lab.llm_eval`).
addopts = "-ra --strict-markers -p no:deepeval -p no:asyncio"
filterwarnings = [
    # DeepEval 4.x notice that Hallucination/Toxicity/Bias now score "higher is better";
    # METRIC_THRESHOLDS already uses that direction (also filtered at runtime in llm_eval).
    "ignore:.*now scores in the same direction:DeprecationWarning",
]
markers = [
    "setup: environment and packaging sanity checks",
    "live_llm: calls a real LLM (Ollama/OpenAI); skipped unless AIQL_RUN_LIVE_TESTS=1",
]
